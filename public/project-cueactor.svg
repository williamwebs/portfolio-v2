<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" fill="none">
  <rect width="800" height="480" rx="16" fill="#090a0c"/>
  <rect x="1" y="1" width="798" height="478" rx="15" stroke="#27272a" stroke-width="1.5"/>
  
  <!-- Browser topbar -->
  <line x1="0" y1="44" x2="800" y2="44" stroke="#27272a" stroke-width="1"/>
  <circle cx="32" cy="22" r="5" fill="#3f3f46"/>
  <circle cx="48" cy="22" r="5" fill="#27272a"/>
  <circle cx="64" cy="22" r="5" fill="#27272a"/>
  <rect x="96" y="12" width="260" height="20" rx="6" fill="#18181b"/>
  <text x="110" y="26" fill="#a1a1aa" font-family="monospace" font-size="10">cueactor.com / rehearsal-room</text>
  
  <!-- Left Side: Script Reader & Turn-Taking Voice Engine -->
  <g transform="translate(40, 68)">
    <rect width="440" height="372" rx="12" fill="#121316" stroke="#27272a"/>
    <text x="24" y="36" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="13">REHEARSAL SCENE: ACT II, SCENE 3</text>
    
    <!-- AI Line 1 -->
    <rect x="20" y="56" width="400" height="74" rx="8" fill="#18181e" stroke="#27272a"/>
    <text x="36" y="80" fill="#34d399" font-family="sans-serif" font-weight="700" font-size="11">● HAZEL (AI SCENE PARTNER)</text>
    <text x="36" y="102" fill="#ffffff" font-family="sans-serif" font-size="12">"You can't walk away now, David. Not after everything we built."</text>
    
    <!-- User Voice Input Live Waveform -->
    <rect x="20" y="146" width="400" height="110" rx="8" fill="#16171d" stroke="#3f3f46"/>
    <text x="36" y="172" fill="#a1a1aa" font-family="sans-serif" font-weight="600" font-size="11">YOUR TURN (SPEAKING...)</text>
    
    <!-- Dynamic Audio Wave -->
    <g transform="translate(36, 190)">
      <rect x="0" y="10" width="4" height="20" rx="2" fill="#ffffff"/>
      <rect x="8" y="2" width="4" height="36" rx="2" fill="#ffffff"/>
      <rect x="16" y="6" width="4" height="28" rx="2" fill="#ffffff"/>
      <rect x="24" y="0" width="4" height="40" rx="2" fill="#ffffff"/>
      <rect x="32" y="8" width="4" height="24" rx="2" fill="#ffffff"/>
      <rect x="40" y="4" width="4" height="32" rx="2" fill="#ffffff"/>
      <rect x="48" y="12" width="4" height="16" rx="2" fill="#ffffff"/>
      <text x="68" y="25" fill="#f4f4f5" font-family="sans-serif" font-size="12">"I never asked for any of this..."</text>
    </g>
    
    <text x="36" y="240" fill="#71717a" font-family="monospace" font-size="10">Real-time WebSocket turn-taking • 42ms latency</text>

    <!-- Bottom status bar -->
    <rect x="20" y="296" width="400" height="48" rx="8" fill="#1c1c22" stroke="#27272a"/>
    <text x="40" y="325" fill="#34d399" font-family="sans-serif" font-weight="600" font-size="11">Agora P2P Video Call &amp; Audio Stream Ready</text>
  </g>
  
  <!-- Right Side: Booking, Google Calendar, Stripe -->
  <g transform="translate(504, 68)">
    <rect width="256" height="372" rx="12" fill="#121316" stroke="#27272a"/>
    <text x="20" y="36" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="12">SESSION BOOKING</text>
    
    <!-- Google Calendar card -->
    <rect x="20" y="56" width="216" height="84" rx="8" fill="#18181e" stroke="#27272a"/>
    <text x="32" y="80" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="11">Google Calendar Sync</text>
    <text x="32" y="98" fill="#a1a1aa" font-family="sans-serif" font-size="10">Nov 14 • 3:00 PM EST</text>
    <text x="32" y="116" fill="#34d399" font-family="sans-serif" font-size="10">● Confirmed Session</text>
    
    <!-- Stripe checkout card -->
    <rect x="20" y="156" width="216" height="84" rx="8" fill="#18181e" stroke="#27272a"/>
    <text x="32" y="180" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="11">Stripe Checkout</text>
    <text x="32" y="198" fill="#a1a1aa" font-family="sans-serif" font-size="10">60-Min Director Session</text>
    <text x="32" y="216" fill="#34d399" font-family="sans-serif" font-size="10">● $75.00 Paid via Stripe</text>
    
    <!-- Admin Metrics -->
    <rect x="20" y="256" width="216" height="88" rx="8" fill="#18181e" stroke="#27272a"/>
    <text x="32" y="280" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="11">Analytics Dashboard</text>
    <text x="32" y="298" fill="#a1a1aa" font-family="sans-serif" font-size="10">Active Rehearsals: 48</text>
    <text x="32" y="316" fill="#34d399" font-family="sans-serif" font-size="10">Platform Health: 99.9%</text>
  </g>
</svg>
